# Builds NITAAQ Mirror with the official Android toolchain (Android Gradle Plugin + Android SDK + R8)
# and commits the signed release APK to NitaaqMirror/dist/.
name: NITAAQ Mirror APK

on:
  push:
    paths:
      - "NitaaqMirror/app/**"
      - "NitaaqMirror/*.kts"
      - "NitaaqMirror/gradle/**"
      - ".github/workflows/nitaaq-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nitaaq-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NitaaqMirror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | head -5
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: NitaaqMirror-release
          path: NitaaqMirror/app/build/outputs/apk/release/app-release.apk

      - name: Commit APK to dist/
        run: |
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          rm -f dist/*.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/NitaaqMirror-$V.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          printf 'NitaaqMirror-%s.apk — built by GitHub Actions with the official Android toolchain (AGP + R8),\nsigned with the project test key (v2/v3). Check: sha256sum -c SHA256SUMS.txt\n' "$V" > dist/README.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          git commit -m "Add CI-built APK $V [skip ci]" || exit 0
          git push
